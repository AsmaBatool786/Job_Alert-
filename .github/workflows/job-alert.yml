name: Job Alert

on:
  schedule:
    # Runs at 06:00 UTC every day. GitHub Actions cron is always UTC —
    # adjust the hour to fit your timezone.
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab, for testing

jobs:
  send-job-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job alert
        env:
          SEARCH_KEYWORDS: ${{ secrets.SEARCH_KEYWORDS }}
          MUNICIPALITIES: ${{ secrets.MUNICIPALITIES }}
          LOOKBACK_HOURS: ${{ secrets.LOOKBACK_HOURS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CV_SUMMARY: ${{ secrets.CV_SUMMARY }}
          RELEVANCE_THRESHOLD: ${{ secrets.RELEVANCE_THRESHOLD }}
        run: python job_alert.py
